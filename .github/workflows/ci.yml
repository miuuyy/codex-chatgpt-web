name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Exercise Windows Scheduled Task lifecycle
        if: runner.os == 'Windows'
        run: |
          bun run build
          bun run smoke:windows-service
      - uses: actions/setup-go@v6
        if: runner.os == 'macOS'
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        if: runner.os == 'macOS'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
