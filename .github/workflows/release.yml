name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: codex-chatgpt-web-darwin-arm64.tar.gz
          - runner: macos-15-intel
            asset: codex-chatgpt-web-darwin-amd64.tar.gz
          - runner: ubuntu-latest
            asset: codex-chatgpt-web-linux-amd64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict dist/runtime/runtime/bun
      - run: bun run smoke
      - run: tar -czf "${{ matrix.asset }}" -C dist/runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Create checksums
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/NOTICE.md release-assets/NOTICE.md
          cp LICENSES/OpenCodex-MIT.txt release-assets/OpenCodex-MIT.txt
          cp LICENSES/Bun-1.3.11.md release-assets/Bun-1.3.11.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cd release-assets
          sha256sum codex-chatgpt-web-*.tar.gz LICENSE NOTICE.md OpenCodex-MIT.txt Bun-1.3.11.md THIRD_PARTY_NOTICES.txt > checksums.txt
      - name: Add installer
        run: cp scripts/install.sh release-assets/install.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
